{% extends 'base.html' %}
{% block title %}Apply for Loan{% endblock %}
{% block page_title %}Apply for Loan{% endblock %}

{% block content %}
<div class="card card-info">
    <div class="card-header">
        <h3 class="card-title">Loan Application</h3>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="card-body">
            {{ form.as_p }}
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-info">Submit Application</button>
        </div>
    </form>
</div>
{% endblock %}
