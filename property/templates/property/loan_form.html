{% extends "base.html" %}
{% block content %}
<div class="content-header"><div class="container-fluid"><h1>{{ title }}</h1></div></div>
<section class="content"><div class="container-fluid">
  <div class="card"><div class="card-body">
    <form method="post">{% csrf_token %}
      {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
      <div class="row">
        {% for field in form %}
        <div class="col-md-6 mb-3">
          <label>{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<small class="text-danger">{{ field.errors }}</small>{% endif %}
        </div>
        {% endfor %}
      </div>
      <button class="btn btn-primary"><i class="fas fa-save"></i> Save Loan</button>
      <a href="{% url 'property:loan_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div></div>
</div></section>
{% endblock %}
