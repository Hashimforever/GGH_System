{% extends "base.html" %}
{% block content %}
<div class="content-header"><div class="container-fluid"><h1>Return Loan {{ loan.loan_code }}</h1></div></div>
<section class="content"><div class="container-fluid">
  <div class="card"><div class="card-body">
    <p><strong>Item:</strong> {{ loan.property_item.name }} — <strong>Qty:</strong> {{ loan.quantity }}</p>
    <form method="post">{% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<small class="text-danger">{{ field.errors }}</small>{% endif %}
      </div>
      {% endfor %}
      <button class="btn btn-success"><i class="fas fa-check"></i> Confirm Return</button>
      <a href="{% url 'property:loan_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div></div>
</div></section>
{% endblock %}
