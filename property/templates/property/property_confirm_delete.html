{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <div class="card border-danger">
    <div class="card-header bg-danger text-white"><h3>Confirm Delete</h3></div>
    <div class="card-body">
      <p>Are you sure you want to delete <strong>{{ item.name }}</strong> ({{ item.code }})?</p>
      <form method="post">{% csrf_token %}
        <button class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'property:property_list' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
